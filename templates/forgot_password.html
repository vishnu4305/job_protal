{% extends "base.html" %}
{% block title %}Forgot Password | TalentHub{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Reset your password</h1>
    <p class="muted">Enter your account details and choose a new password.</p>
    {% if message %}<div class="notice">{{ message }}</div>{% endif %}
    <form action="/forgot-password" method="post" class="form-stack">
      <label>Account type
        <select name="role" required>
          <option value="candidate" {% if role == 'candidate' %}selected{% endif %}>Candidate</option>
          <option value="employer" {% if role == 'employer' %}selected{% endif %}>Employer</option>
        </select>
      </label>
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Registered email<input type="email" name="email" autocomplete="email" required></label>
      <label>New password<input type="password" name="new_password" minlength="8" autocomplete="new-password" required></label>
      <label>Confirm new password<input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label>
      <button class="btn btn-primary" type="submit">Update password</button>
    </form>
    <p class="form-foot"><a href="/login">Candidate login</a> · <a href="/employer/login">Employer login</a></p>
  </div>
</section>
{% endblock %}
