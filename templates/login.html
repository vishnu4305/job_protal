{% extends "base.html" %}{% block title %}Candidate Login{% endblock %} {% block
content %}
<section class="auth-section">
  <div class="auth-card">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Candidate login</h1>
    <p class="muted">Sign in to manage your applications.</p>
    {% if message %}
    <div class="notice">{{ message }}</div>
    {% endif %}
    <form action="/login" method="post" class="form-stack">
      <label>Username<input name="username" required /></label
      ><label>Password<input type="password" name="password" required /></label
      ><button class="btn btn-primary">Login</button>
    </form>
    <p class="form-foot">
      <a href="/forgot-password?role=candidate">Forgot password?</a>
    </p>
    <p class="form-foot">
      New to TalentHub? <a href="/register">Create an account</a>
    </p>
  </div>
</section>
{% endblock %}
